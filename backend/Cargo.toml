[package]
name = "vvcoffice"
version = "0.1.0"
edition = "2021"
description = "Private single-project VVC Office workspace"
license = "MIT"

[dependencies]
argon2 = "0.5"
axum = { version = "0.7", features = ["macros"] }
include_dir = "0.7"
base64 = "0.22"
http = "1"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid"] }
uuid = "1"
tower-http = { version = "0.5", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
