[package]
name = "aegiscore"
version = "0.1.0"
edition = "2021"
description = "Private single-project AegisCore workspace"
license = "MIT"

[dependencies]
argon2 = "0.5"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
http = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
