services:
  - type: web
    name: vvcoffice
    runtime: rust
    rootDir: backend
    buildCommand: cargo build --release
    startCommand: ./target/release/vvcoffice
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VVC_DEV_PASSWORD
        sync: false
      - key: VVC_GATEWAY_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
