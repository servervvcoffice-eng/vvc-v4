services:
  - type: web
    name: aegiscore
    runtime: rust
    rootDir: backend
    buildCommand: cargo build --release
    startCommand: ./target/release/aegiscore
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AEGIS_DEV_PASSWORD
        sync: false
      - key: AEGIS_GATEWAY_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
