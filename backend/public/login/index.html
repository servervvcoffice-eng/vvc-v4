<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Sign In</title>
<link rel="stylesheet" href="/assets/login.css">
<style data-aegis-login-fallback>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
}

body {
  min-height: 100vh;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
  color: #171717;
}

.container {
  width: 100%;
  max-width: 360px;
}

.logo {
  width: 58px;
  height: 58px;
  background: #111;
  color: #fff;
  border-radius: 17px;
  display: grid;
  place-items: center;
  font-size: 24px;
  font-weight: 700;
  margin: 0 auto 34px;
}

h1 {
  font-size: 31px;
  letter-spacing: -1.1px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 9px;
}

.subtitle {
  font-size: 14px;
  color: #888;
  line-height: 1.6;
  text-align: center;
  margin-bottom: 38px;
}

.field {
  margin-bottom: 22px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 9px;
}

.input {
  width: 100%;
  height: 53px;
  padding: 0 15px;
  border: 1px solid #e7e7e7;
  border-radius: 12px;
  outline: none;
  font-size: 14px;
  background: #fff;
  transition: .2s;
}

.input:focus {
  border-color: #171717;
}

.input::placeholder {
  color: #b0b0b0;
}

.password-wrap {
  position: relative;
}

.password-wrap input {
  padding-right: 55px;
}

.eye {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #999;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.login {
  width: 100%;
  height: 53px;
  background: #111;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  margin-top: 9px;
  cursor: pointer;
  transition: .2s;
}

.login:active {
  opacity: .8;
  transform: scale(.99);
}

.login:disabled {
  opacity: .6;
  cursor: wait;
}

.error {
  color: #b42318;
  background: #fff1f0;
  border: 1px solid #ffd2cf;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 14px;
  text-align: center;
}

.footer {
  text-align: center;
  color: #aaa;
  font-size: 11px;
  margin-top: 42px;
}

</style>
</head>
<body>
<main class="container">
  <div class="logo">A</div>
  <h1>Welcome back</h1>
  <p class="subtitle">Enter your details to sign in to your account.</p>
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input class="input" id="username" name="username" type="text" autocomplete="username" placeholder="Enter username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
        <span class="eye" id="eye" role="button" tabindex="0" aria-label="Show password">SHOW</span>
      </div>
    </div>
    <button class="login" type="submit">Sign in</button>
    <p id="loginError" class="error" role="alert" hidden></p>
  </form>
  <div class="footer">© 2026 Your Brand</div>
</main>
<script src="/assets/login.js" defer></script>
</body>
</html>
